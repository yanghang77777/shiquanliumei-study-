async function startPK(participantIds, mode){
  const is1v2 = mode === '1v2';
  const fighters = participantIds.map(id => {
    const child = appData.children.find(c => c.id === id);
    const stats = calcCombatPower(child);
    const pt = PET_TYPES[child.pet.type];
    const skillId = child.pet.skillSlot || pt.baseSkill;
    return {
      id: child.id, childId: child.id,
      nick: child.nick,
      petName: child.pet.name,
      petType: child.pet.type,
      petEmoji: getPetStage(child.pet.type, child.pet.level).face,
      weaponEmoji: child.pet.weapon ? WEAPONS[child.pet.weapon].emoji : '',
      armorEmoji: child.pet.armor ? ARMORS[child.pet.armor].emoji : '',
      skill: skillId,
      hp: stats.maxHp, maxHp: stats.maxHp,
      attack: stats.attack, defense: stats.defense, speed: stats.speed,
      isDefending: false, debuffed: false,
      side: pkSetupState.sideA.includes(id) ? 'A' : 'B',
    };
  });

  // 渲染PK战场
  renderPKArena(fighters, mode);
  await sleep(800);

  // 宠物互动彩蛋
  const interactionEggs = [
    { msg: '🐾 小猫追着小鸡跑了一圈！小鸡生气地竖起了羽毛！', cond: (fs) => fs.some(f=>f.petType==='cat') && fs.some(f=>f.petType==='chick') },
    { msg: '🦴 小狗摇着尾巴想和小乌龟玩，小乌龟缩进了壳里...', cond: (fs) => fs.some(f=>f.petType==='puppy') && fs.some(f=>f.petType==='turtle') },
    { msg: '🐱 小猫舔了舔爪子，不屑地看了小狗一眼。小狗委屈地汪了一声。', cond: (fs) => fs.some(f=>f.petType==='cat') && fs.some(f=>f.petType==='puppy') },
    { msg: '🐢 小乌龟慢悠悠地走着，小鸡在旁边急得跳脚：快点呀！', cond: (fs) => fs.some(f=>f.petType==='turtle') && fs.some(f=>f.petType==='chick') },
    { msg: '🐾 大家互相看了一眼，气氛有点紧张...战斗一触即发！', cond: () => true },
  ];
  const validEggs = interactionEggs.filter(e => e.cond(fighters));
  if(validEggs.length > 0){
    const egg = validEggs[Math.floor(Math.random() * validEggs.length)];
    await pkLog(`<div style="color:#fbbf24;font-size:13px;font-style:italic;">${egg.msg}</div>`);
    await sleep(1500);
  }

  await sleep(500);

  // 回合制战斗
  let round = 1;
  while(fighters.filter(f => f.hp > 0).length > 1 && round <= 15){
    // 按速度排序
    const alive = fighters.filter(f => f.hp > 0).sort((a,b) => b.speed - a.speed);
    for(const fighter of alive){
      if(fighter.hp <= 0) continue;
      const enemies = fighters.filter(f => f.side !== fighter.side && f.hp > 0);
      if(enemies.length === 0) break;
      // 宠物AI策略：不同宠物有不同性格
      let target;
      const pt = PET_TYPES[fighter.petType];
      if(fighter.petType === 'turtle'){
        // 乌龟：血少时50%概率防御，否则攻击最弱的
        if(fighter.hp < fighter.maxHp * 0.4 && Math.random() < 0.5){
          const defendSkill = SKILLS['shellDefend'];
          await pkLog(`<div class="pk-round-info">第${round}回合 · ${fighter.petName}出手！</div>`);
          await sleep(600);
          await pkUseSkill(fighter, fighter, defendSkill);
          await sleep(900);
          updatePKArena(fighters);
          continue;
        }
        target = enemies.sort((a,b) => a.hp - b.hp)[0];
      } else if(fighter.petType === 'cat'){
        // 小猫：优先攻击防御最低的（脆皮杀手）
        target = enemies.sort((a,b) => a.defense - b.defense)[0];
      } else if(fighter.petType === 'chick'){
        // 小鸡：速度型，随机选目标（快但莽撞）
        target = enemies[Math.floor(Math.random() * enemies.length)];
      } else {
        // 小狗：均衡型，选HP最低的
        target = enemies.sort((a,b) => a.hp - b.hp)[0];
      }

      await pkLog(`<div class="pk-round-info">第${round}回合 · ${fighter.petName}出手！</div>`);
      await sleep(600);

      // 技能选择：已装备的技能
      const skill = SKILLS[fighter.skill];
      await pkUseSkill(fighter, target, skill);
      await sleep(900);
      updatePKArena(fighters);

      if(target.hp <= 0){
        await pkLog(`<div class="pk-faint">${target.petName} 倒下了！💫</div>`);
        await sleep(700);
      }
      // 检查是否一方全灭
      const aAlive = fighters.filter(f => f.side === 'A' && f.hp > 0).length;
      const bAlive = fighters.filter(f => f.side === 'B' && f.hp > 0).length;
      if(aAlive === 0 || bAlive === 0) break;
    }
    round++;
  }

  // 判定胜负
  const aAlive = fighters.filter(f => f.side === 'A' && f.hp > 0);
  const bAlive = fighters.filter(f => f.side === 'B' && f.hp > 0);
  let winners, losers;
  if(aAlive.length > 0 && bAlive.length === 0){
    winners = aAlive; losers = fighters.filter(f => f.side === 'B');
  } else if(bAlive.length > 0 && aAlive.length === 0){
    winners = bAlive; losers = fighters.filter(f => f.side === 'A');
  } else {
    // 超时，按剩余HP百分比判定
    const aHpPct = aAlive.reduce((s,f) => s + f.hp/f.maxHp, 0);
    const bHpPct = bAlive.reduce((s,f) => s + f.hp/f.maxHp, 0);
    if(aHpPct >= bHpPct){ winners = aAlive; losers = fighters.filter(f => f.side === 'B'); }
    else { winners = bAlive; losers = fighters.filter(f => f.side === 'A'); }
  }

  await sleep(800);
  pkEnd(winners, losers, mode, fighters);
}

function renderPKArena(fighters, mode){
  let html = `<div class="pk-title">⚔️ ${mode==='1v2'?'以一敌二':'宠物对战'}</div>`;
  html += '<div class="pk-arena" id="pkArena">';

  // A方
  const sideA = fighters.filter(f => f.side === 'A');
  const sideB = fighters.filter(f => f.side === 'B');
  html += '<div class="pk-fighters">';
  html += renderPKFighterBlock(sideA[0]);
  html += '<div class="pk-vs">VS</div>';
  sideB.forEach(f => html += renderPKFighterBlock(f));
  html += '</div>';
  html += '</div>'; // arena

  // 战斗日志
  html += '<div class="pk-log" id="pkLog"></div>';

  document.getElementById('pkContainer').innerHTML = html;
  document.getElementById('pkOverlay').classList.add('show');
}

function renderPKFighterBlock(f){
  const hpPct = (f.hp / f.maxHp) * 100;
  const hpClass = hpPct < 30 ? 'low' : hpPct < 60 ? 'mid' : '';
  return `<div class="pk-fighter" id="fighter_${f.id}">
    <div class="pk-fighter-emoji">${f.petEmoji}<span class="pk-fighter-armor">${f.weaponEmoji || ''}${f.armorEmoji}</span></div>
    <div class="pk-fighter-name">${f.petName}</div>
    <div class="pk-fighter-armor" style="font-size:10px;color:rgba(255,255,255,.6);">${f.nick}</div>
    <div class="pk-hp-bar-wrap">
      <div class="pk-hp-label">HP ${f.hp}/${f.maxHp}</div>
      <div class="pk-hp-bar"><div class="pk-hp-fill ${hpClass}" id="hp_${f.id}" style="width:${hpPct}%;"></div></div>
    </div>
    <div class="pk-stats">⚔️${f.attack} 🛡️${f.defense} 💨${f.speed}</div>
  </div>`;
}

function updatePKArena(fighters){
  fighters.forEach(f => {
    const hpEl = document.getElementById('hp_' + f.id);
    const fighterEl = document.getElementById('fighter_' + f.id);
    if(hpEl){
      const pct = Math.max(0, (f.hp / f.maxHp) * 100);
      hpEl.style.width = pct + '%';
      hpEl.className = 'pk-hp-fill ' + (pct < 30 ? 'low' : pct < 60 ? 'mid' : '');
      const labelEl = hpEl.parentElement.previousElementSibling;
      if(labelEl) labelEl.textContent = `HP ${f.hp}/${f.maxHp}`;
    }
    if(fighterEl && f.hp <= 0){
      fighterEl.classList.add('fainted');
    }
  });
}

async function pkUseSkill(attacker, target, skill){
  // 技能特效
  playSkillFx(skill, attacker, target);
  document.getElementById('pkArena').classList.add('shake');
  setTimeout(() => document.getElementById('pkArena').classList.remove('shake'), 300);

  if(skill.type === 'attack'){
    let damage = skill.power + attacker.attack - Math.floor(target.defense * 0.5);
    if(target.isDefending) damage = Math.floor(damage * 0.5);
    if(attacker.debuffed) damage = Math.floor(damage * 0.7);
    damage = Math.max(1, damage);
    const isCrit = attacker.petType === 'cat' && Math.random() < 0.25;
    if(isCrit) damage = Math.floor(damage * 1.5);
    target.hp = Math.max(0, target.hp - damage);
    target.isDefending = false;
    await pkLog(`<div class="pk-skill-log">${skill.emoji} <b>${attacker.petName}</b> 使用了 <b>${skill.name}</b>！${isCrit?'暴击！':''}对 <b>${target.petName}</b> 造成 <b>${damage}</b> 点伤害</div>`);
  } else if(skill.type === 'defense'){
    attacker.isDefending = true;
    await pkLog(`<div class="pk-skill-log">${skill.emoji} <b>${attacker.petName}</b> 使用了 <b>${skill.name}</b>！🛡️ 防御提升！</div>`);
  } else if(skill.type === 'heal'){
    const heal = Math.floor(attacker.maxHp * 0.15);
    attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
    attacker.isDefending = false;
    await pkLog(`<div class="pk-skill-log">${skill.emoji} <b>${attacker.petName}</b> 使用了 <b>${skill.name}</b>！💚 恢复了 ${heal} 点体力！</div>`);
  } else if(skill.type === 'debuff'){
    target.debuffed = true;
    attacker.isDefending = false;
    await pkLog(`<div class="pk-skill-log">${skill.emoji} <b>${attacker.petName}</b> 使用了 <b>${skill.name}</b>！${target.petName} 被削弱了！</div>`);
  }
}

function playSkillFx(skill, attacker, target){
  const arena = document.getElementById('pkArena');
  if(!arena) return;
  const fx = document.createElement('div');
  fx.className = 'pk-fx';
  const emojis = {
    peck:['⚡','⚡','⚡'], flutter:['🍃','💨','🍃'], eggBomb:['🥚','💥','🌟'],
    bite:['🦷','❤️','✨'], bark:['📢','〰️','📢'], guardian:['🛡️','✨','🛡️'],
    shellDefend:['🐢','💨','🛡️'], waterGun:['💦','💧','💦'], slowHeal:['💚','✨','💖'],
    scratch:['🐾','🐾','✨'], meowSong:['🎵','💤','🎶'], pounce:['💥','⭐','🔥'],
  };
  const arr = emojis[skill.type === 'attack' ? skill.name.includes('啄') ? 'peck' :
    skill.name.includes('翅膀') ? 'flutter' : skill.name.includes('彩蛋') ? 'eggBomb' :
    skill.name.includes('咬') ? 'bite' : skill.name.includes('汪') ? 'bark' :
    skill.name.includes('水') ? 'waterGun' : skill.name.includes('猫爪') ? 'scratch' :
    skill.name.includes('猛扑') ? 'pounce' : ['✨']
  : skill.type === 'defense' ? ['🛡️','✨','💨']
  : skill.type === 'heal' ? ['💚','✨','💖']
  : ['🎵','💤','🎶']] || ['✨'];
  fx.innerHTML = arr.map((e,i) => `<span class="fx-particle" style="animation-delay:${i*0.1}s">${e}</span>`).join('');
  arena.appendChild(fx);
  setTimeout(() => fx.remove(), 900);
}

async function pkLog(msg){
  const logEl = document.getElementById('pkLog');
  if(!logEl) return;
  const item = document.createElement('div');
  item.className = 'pk-log-item';
  item.innerHTML = msg;
  logEl.appendChild(item);
  logEl.scrollTop = logEl.scrollHeight;
  await sleep(50);
}

function pkEnd(winners, losers, mode, allFighters){
  const is1v2 = mode === '1v2';
  let html = '<div class="pk-result">';

  const winnerNames = winners.map(w => w.petName).join(' & ');
  html += '<div class="pk-result-trophy">🏆</div>';
  html += `<div class="pk-result-name">${winnerNames} 获胜！</div>`;
  html += `<div style="color:rgba(255,255,255,.6);font-size:13px;margin-bottom:16px;">恭喜${winners.map(w=>w.nick).join('和')}！</div>`;

  // 奖励
  html += '<div style="background:rgba(255,255,255,.1);border-radius:14px;padding:16px;margin:10px 0;">';
  winners.forEach(w => {
    const child = appData.children.find(c => c.id === w.childId);
    const bonus = is1v2 && w.side === 'A' ? 2 : 1; // 1v2单挑方胜利奖励翻倍
    const points = 10 * bonus;
    const cakes = 1 * bonus;
    child.pet.pkWins++;
    child.totalPoints += points;
    child.weekPoints += points;
    child.pet.exp += 20;
    child.foodBag.cake = (child.foodBag.cake || 0) + cakes;
    checkPetLevelUp(w.childId);
    html += `<div style="color:#fbbf24;font-size:14px;margin:4px 0;">🎉 ${w.petName}: +${points}积分 +${cakes}🍰 +20经验</div>`;
  });
  losers.forEach(l => {
    const child = appData.children.find(c => c.id === l.childId);
    child.pet.pkLosses++;
    child.pet.exp += 5;
    checkPetLevelUp(l.childId);
    html += `<div style="color:rgba(255,255,255,.5);font-size:12px;margin:4px 0;">💪 ${l.petName}: +5经验（参与奖）</div>`;
  });
  html += '</div>';

  html += '<div style="margin-top:16px;text-align:center;">';
  html += '<button class="pk-mode-btn" onclick="closePKArena();showPKSetup()">⚔️ 再来一局</button>';
  html += '<button class="pk-mode-btn" onclick="closePKArena()">返回</button>';
  html += '</div>';
  html += '</div>';

  saveData();
  document.getElementById('pkContainer').innerHTML = html;
}

ocument'){\n          return caches.match('./index.html');\n        }\n      });\n    })\n  );\n});\n";
  const blob = new Blob([swCode], {type: 'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  window.addEventListener('load', () => {
