<title>三宝学习大本营 · 暑期成长工作台</title>
<style>
:root{
  --radius: 20px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  /* 淳宝 - 紫粉星空（13岁少女·优雅梦幻） */
  --c1-grad: linear-gradient(160deg, #faf5ff 0%, #fdf2f8 50%, #fce7f3 100%);
  --c1-accent: #a855f7;
  --c1-accent2: #ec4899;
  --c1-soft: rgba(168,85,247,.1);
  --c1-shadow: 0 8px 30px rgba(168,85,247,.15);
  /* 悦宝 - 蜜桃暖橙（9岁女孩·活力甜美） */
  --c2-grad: linear-gradient(160deg, #fff7ed 0%, #fef3c7 50%, #fecaca 100%);
  --c2-accent: #f97316;
  --c2-accent2: #f43f5e;
  --c2-soft: rgba(249,115,22,.1);
  --c2-shadow: 0 8px 30px rgba(249,115,22,.15);
  /* 东哥 - 蓝绿海洋（7岁男孩·勇敢探险） */
  --c3-grad: linear-gradient(160deg, #ecfeff 0%, #e0f2fe 50%, #d1fae5 100%);
  --c3-accent: #0ea5e9;
  --c3-accent2: #10b981;
  --c3-soft: rgba(14,165,233,.1);
  --c3-shadow: 0 8px 30px rgba(14,165,233,.15);
}

*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{font-family:var(--font); color:#1f2937; min-height:100vh; -webkit-font-smoothing:antialiased;}

/* 插画风格背景 */
body{
  background:
    radial-gradient(ellipse at 20% 0%, rgba(168,85,247,.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 10%, rgba(14,165,233,.08) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(249,115,22,.06) 0%, transparent 50%),
    linear-gradient(180deg, #fafbff 0%, #fef6f9 50%, #f0f9f4 100%);
  background-attachment: fixed;
  padding:12px;
  max-width:1200px;
  margin:0 auto;
}

/* 背景装饰气泡 */
body::before, body::after{
  content:''; position:fixed; border-radius:50%; z-index:-1; opacity:.4; pointer-events:none;
}
body::before{
  width:300px; height:300px; top:-80px; right:-60px;
  background:radial-gradient(circle, rgba(168,85,247,.15), transparent 70%);
}
body::after{
  width:250px; height:250px; bottom:-60px; left:-60px;
  background:radial-gradient(circle, rgba(14,165,233,.15), transparent 70%);
}

/* === 顶部标题 === */
.app-header{
  text-align:center; padding:28px 16px 12px; position:relative;
}
.app-header .logo-emoji{font-size:36px; display:block; margin-bottom:4px;}
.app-header h1{
  font-size:26px; font-weight:800;
  background:linear-gradient(135deg,#a855f7 0%, #f97316 50%, #0ea5e9 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  letter-spacing:1px;
}
.app-header .subtitle{font-size:13px; color:#6b7280; margin-top:6px;}
.app-header .date-info{
  font-size:12px; color:#9ca3af; margin-top:4px;
  display:inline-flex; align-items:center; gap:6px;
  background:#fff; padding:4px 14px; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,.06);
}

/* === 工具栏 === */
.toolbar{
  display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:16px 0;
}
.toolbar button{
  padding:9px 16px; border:none; border-radius:14px; font-size:13px; font-weight:600;
  cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:5px;
  background:#fff; color:#4b5563; box-shadow:0 2px 10px rgba(0,0,0,.06);
}
.toolbar button:hover{transform:translateY(-2px); box-shadow:0 4px 14px rgba(0,0,0,.1);}
.toolbar button:active{transform:translateY(0);}

/* === 时段进度条 === */
.session-bar{
  background:#fff; border-radius:18px; padding:14px 18px; margin-bottom:16px;
  box-shadow:0 4px 20px rgba(0,0,0,.06); display:flex; gap:12px; align-items:center; flex-wrap:wrap;
}
.session-item{
  flex:1; min-width:200px; display:flex; align-items:center; gap:10px; padding:8px 12px;
  border-radius:14px; transition:all .3s;
}
.session-item.am{background:linear-gradient(135deg,#fef3c7,#fed7aa);}
.session-item.pm{background:linear-gradient(135deg,#ddd6fe,#bbf7d0);}
.session-emoji{font-size:24px;}
.session-text{flex:1;}
.session-label{font-size:13px; font-weight:700; color:#374151;}
.session-time{font-size:11px; color:#6b7280; margin-top:1px;}
.session-progress{width:60px; height:6px; background:rgba(0,0,0,.1); border-radius:3px; overflow:hidden;}
.session-fill{height:100%; border-radius:3px; transition:width .5s;}
.session-item.am .session-fill{background:#f59e0b;}
.session-item.pm .session-fill{background:#8b5cf6;}

/* === 排行榜 === */
.leaderboard{
  background:#fff; border-radius:var(--radius); padding:18px; margin-bottom:16px;
  box-shadow:0 6px 24px rgba(0,0,0,.07);
  position:relative; overflow:hidden;
}
.leaderboard::before{
  content:'👑'; position:absolute; top:10px; right:16px; font-size:28px; opacity:.15;
}
.leaderboard h2{font-size:16px; margin-bottom:14px; display:flex; align-items:center; gap:6px;}
.rank-list{display:flex; gap:10px; flex-wrap:wrap;}
.rank-item{
  flex:1; min-width:130px; padding:14px 10px; border-radius:16px; text-align:center; position:relative;
  transition:transform .2s; cursor:default;
}
.rank-item:hover{transform:scale(1.04);}
.rank-item .rank-num{font-size:24px; font-weight:800;}
.rank-item .rank-name{font-size:14px; font-weight:700; margin:4px 0 2px;}
.rank-item .rank-score{font-size:11px; opacity:.8;}
.rank-item .rank-badge{position:absolute; top:-10px; right:-4px; font-size:22px;}
.rank-1{background:linear-gradient(135deg,#fef3c7,#fde68a); color:#92400e; box-shadow:0 4px 14px rgba(245,158,11,.25);}
.rank-2{background:linear-gradient(135deg,#f1f5f9,#e2e8f0); color:#475569; box-shadow:0 4px 14px rgba(100,116,139,.15);}
.rank-3{background:linear-gradient(135deg,#fed7aa,#fdba74); color:#7c2d12; box-shadow:0 4px 14px rgba(234,88,12,.2);}

/* === 孩子卡片 === */
.children-grid{display:grid; grid-template-columns:1fr; gap:18px;}
@media(min-width:900px){.children-grid{grid-template-columns:1fr 1fr 1fr;}}

.child-card{
  border-radius:var(--radius); padding:0; box-shadow:var(--c1-shadow);
  transition:all .3s; position:relative; overflow:hidden;
}
.child-card.c1{background:var(--c1-grad); box-shadow:var(--c1-shadow);}
.child-card.c2{background:var(--c2-grad); box-shadow:var(--c2-shadow);}
.child-card.c3{background:var(--c3-grad); box-shadow:var(--c3-shadow);}
.child-card:hover{transform:translateY(-3px);}

/* 卡片顶部插画横幅 */
.card-banner{
  height:80px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;
}
.c1 .card-banner{background:linear-gradient(135deg,#a855f7,#ec4899);}
.c2 .card-banner{background:linear-gradient(135deg,#f97316,#f43f5e);}
.c3 .card-banner{background:linear-gradient(135deg,#0ea5e9,#10b981);}
.card-banner::after{
  content:''; position:absolute; bottom:-1px; left:0; right:0; height:20px;
  background:inherit; border-radius:50% 50% 0 0 / 100% 100% 0 0;
}
.card-banner .banner-art{font-size:40px; z-index:1; filter:drop-shadow(0 2px 6px rgba(0,0,0,.2));}
.card-banner .banner-stars{
  position:absolute; inset:0; overflow:hidden;
}
.card-banner .banner-stars span{
  position:absolute; color:rgba(255,255,255,.6); font-size:10px;
  animation:twinkle 2s infinite alternate;
}
@keyframes twinkle{from{opacity:.3;} to{opacity:1;}}

.card-body{padding:16px 18px 18px;}

/* 头像区 */
.child-header{display:flex; align-items:center; gap:12px; margin-bottom:14px; margin-top:-30px; position:relative; z-index:2;}
.child-avatar{
  width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:30px; background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.15); flex-shrink:0;
  border:3px solid #fff;
}
.child-info{flex:1; padding-top:24px;}
.child-name{font-size:18px; font-weight:800; color:#1f2937;}
.child-nick{font-size:12px; font-weight:600; opacity:.6;}
.child-meta{font-size:11px; opacity:.7; margin-top:2px;}

/* 等级条 */
.level-bar{
  background:rgba(255,255,255,.7); border-radius:14px; padding:10px 14px; margin-bottom:12px;
  backdrop-filter:blur(4px);
}
.level-row{display:flex; justify-content:space-between; align-items:center; font-size:12px; margin-bottom:6px;}
.level-row .level-tag{font-weight:800; font-size:13px;}
.progress-bar{height:8px; background:rgba(0,0,0,.08); border-radius:4px; overflow:hidden;}
.progress-fill{height:100%; border-radius:4px; transition:width .5s ease;}
.c1 .progress-fill{background:linear-gradient(90deg,#a855f7,#ec4899);}
.c2 .progress-fill{background:linear-gradient(90deg,#f97316,#f43f5e);}
.c3 .progress-fill{background:linear-gradient(90deg,#0ea5e9,#10b981);}

/* 统计 */
.stats-row{display:flex; gap:8px; margin-bottom:14px;}
.stat-box{
  flex:1; background:rgba(255,255,255,.65); border-radius:12px; padding:8px 6px; text-align:center;
}
.stat-box .stat-val{font-size:18px; font-weight:800;}
.stat-box .stat-label{font-size:10px; opacity:.7; margin-top:2px;}

/* 时段任务 */
.session-block{margin-bottom:12px;}
.session-block-title{
  font-size:12px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:5px;
  padding:4px 10px; border-radius:10px; width:fit-content;
}
.session-block-title.am{background:rgba(245,158,11,.15); color:#92400e;}
.session-block-title.pm{background:rgba(139,92,246,.15); color:#5b21b6;}
.task-list{display:flex; flex-direction:column; gap:6px;}
.task-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  background:rgba(255,255,255,.7); border-radius:13px; cursor:pointer; transition:all .2s;
  user-select:none;
}
.task-item:hover{background:rgba(255,255,255,95%); transform:translateX(2px);}
.task-item.done{opacity:.55;}
.task-item.done .task-text{text-decoration:line-through;}
.task-check{
  width:24px; height:24px; border-radius:50%; border:2.5px solid; display:flex;
  align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; font-size:14px; font-weight:700;
}
.task-item:not(.done) .task-check{background:transparent; border-color:rgba(0,0,0,.2);}
.task-item.done .task-check{color:#fff; border-color:transparent;}
.c1 .task-item.done .task-check{background:var(--c1-accent);}
.c2 .task-item.done .task-check{background:var(--c2-accent);}
.c3 .task-item.done .task-check{background:var(--c3-accent);}
.task-text{flex:1; font-size:13px; font-weight:500;}
.task-points{
  font-size:10px; font-weight:700; padding:2px 8px; border-radius:8px;
}
.c1 .task-points{background:var(--c1-soft); color:var(--c1-accent);}
.c2 .task-points{background:var(--c2-soft); color:var(--c2-accent);}
.c3 .task-points{background:var(--c3-soft); color:var(--c3-accent);}

/* 阅读区 */
.reading-section{
  margin-top:14px; background:rgba(255,255,255,.6); border-radius:16px; padding:14px;
  backdrop-filter:blur(4px);
}
.reading-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.reading-header h3{font-size:13px; font-weight:700; display:flex; align-items:center; gap:5px;}
.reading-mins{
  font-size:12px; font-weight:700; padding:4px 12px; border-radius:12px; background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
}
.reading-log{display:flex; gap:5px; margin-bottom:10px;}
.reading-day{
  flex:1; text-align:center; font-size:10px; padding:6px 2px; border-radius:10px; background:rgba(0,0,0,.04);
  transition:all .2s;
}
.reading-day .day-label{opacity:.6; font-size:9px;}
.reading-day .day-mark{font-size:16px; font-weight:700; margin-top:2px;}
.reading-day.today{background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.08); transform:scale(1.08);}
.reading-input-row{display:flex; gap:6px; margin-top:8px;}
.reading-input-row input{
  flex:1; padding:8px 12px; border:1px solid #e5e7eb; border-radius:10px; font-size:12px; outline:none;
  transition:border .2s;
}
.reading-input-row input:focus{border-color:var(--c1-accent);}
.c2 .reading-input-row input:focus{border-color:var(--c2-accent);}
.c3 .reading-input-row input:focus{border-color:var(--c3-accent);}
.reading-input-row button{
  padding:8px 16px; border:none; border-radius:10px; font-size:12px; font-weight:700; cursor:pointer; color:#fff;
  transition:filter .2s;
}
.c1 .reading-input-row button{background:var(--c1-accent);}
.c2 .reading-input-row button{background:var(--c2-accent);}
.c3 .reading-input-row button{background:var(--c3-accent);}
.reading-input-row button:hover{filter:brightness(1.1);}

/* 书单 */
.section-title{
  font-size:13px; font-weight:700; margin:16px 0 8px; display:flex; align-items:center; gap:5px;
}
.book-recommend{margin-top:4px;}
.book-item{
  display:flex; gap:10px; padding:10px; background:#fff; border-radius:13px; margin-bottom:6px;
  align-items:center; transition:all .2s;
}
.book-item:hover{transform:translateX(2px); box-shadow:0 2px 10px rgba(0,0,0,.06);}
.book-emoji{font-size:24px; flex-shrink:0;}
.book-info{flex:1; min-width:0;}
.book-title{font-size:12px; font-weight:700;}
.book-desc{font-size:10px; opacity:.65; margin-top:2px;}
.book-tag{
  display:inline-block; font-size:9px; padding:1px 6px; border-radius:6px; margin-left:4px;
  font-weight:600;
}
.book-tag.history{background:#fef3c7; color:#92400e;}
.book-tag.science{background:#dbeafe; color:#1e40af;}
.book-status{
  font-size:10px; padding:4px 10px; border-radius:10px; cursor:pointer; flex-shrink:0;
  border:1.5px solid; transition:all .2s; font-weight:600;
}
.book-status.unread{color:#9ca3af; border-color:#e5e7eb;}
.book-status.reading{color:#f59e0b; border-color:#f59e0b; background:#fef3c7;}
.book-status.done{color:#16a34a; border-color:#16a34a; background:#dcfce7;}

/* 奖励 */
.reward-section{margin-top:14px;}
.reward-btn{
  width:100%; padding:12px; border:none; border-radius:14px; font-size:13px; font-weight:700;
  cursor:pointer; transition:all .2s; color:#fff; display:flex; align-items:center; justify-content:center; gap:6px;
}
.c1 .reward-btn{background:linear-gradient(135deg,#a855f7,#ec4899);}
.c2 .reward-btn{background:linear-gradient(135deg,#f97316,#f43f5e);}
.c3 .reward-btn{background:linear-gradient(135deg,#0ea5e9,#10b981);}
.reward-btn:hover{filter:brightness(1.1); transform:translateY(-1px);}
.reward-btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}

.add-task-btn{
  width:100%; padding:9px; border:1.5px dashed rgba(0,0,0,.15); border-radius:12px;
  background:transparent; font-size:12px; color:#6b7280; cursor:pointer; margin-top:6px;
  transition:all .2s; font-weight:600;
}
.add-task-btn:hover{background:rgba(255,255,255,.5);}

.streak-badge{
  display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700;
  padding:3px 10px; border-radius:12px; background:#fef3c7; color:#92400e;
  box-shadow:0 2px 6px rgba(245,158,11,.2);
}

/* === 弹窗 === */
.modal-overlay{
  position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5);
  display:none; align-items:center; justify-content:center; z-index:100; padding:16px;
  backdrop-filter:blur(4px);
}
.modal-overlay.show{display:flex;}
.modal{
  background:#fff; border-radius:24px; padding:28px 24px; max-width:420px; width:100%; max-height:80vh;
  overflow-y:auto; animation:popIn .3s ease;
}
@keyframes popIn{from{transform:scale(.9); opacity:0;} to{transform:scale(1); opacity:1;}}
.modal h2{font-size:20px; margin-bottom:14px;}
.modal p{font-size:14px; color:#4b5563; margin-bottom:14px; line-height:1.7;}
.modal-actions{display:flex; gap:10px;}
.modal-actions button{
  flex:1; padding:12px; border:none; border-radius:14px; font-size:14px; font-weight:600; cursor:pointer;
  transition:all .2s;
}
.btn-primary{background:#4f46e5; color:#fff;}
.btn-primary:hover{background:#4338ca;}
.btn-secondary{background:#f3f4f6; color:#4b5563;}
.btn-secondary:hover{background:#e5e7eb;}

/* === 庆祝 === */
.celebration{
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:200;
  display:none; text-align:center;
}
.celebration.show{display:block; animation:celebrate 1.2s ease;}
@keyframes celebrate{
  0%{transform:translate(-50%,-50%) scale(0) rotate(-10deg);}
  50%{transform:translate(-50%,-50%) scale(1.3) rotate(5deg);}
  100%{transform:translate(-50%,-50%) scale(1) rotate(0);}
}
.celebration .star{font-size:72px; filter:drop-shadow(0 4px 20px rgba(0,0,0,.2));}
.celebration .text{
  font-size:22px; font-weight:800; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.4); margin-top:10px;
  background:rgba(0,0,0,.3); padding:6px 20px; border-radius:20px; display:inline-block;
}

/* 烟花粒子 */
.firework{
  position:fixed; width:4px; height:4px; border-radius:50%; z-index:199; pointer-events:none;
}

/* === Toast === */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.85); color:#fff; padding:12px 24px; border-radius:14px;
  font-size:13px; z-index:300; opacity:0; transition:opacity .3s, transform .3s; pointer-events:none;
  font-weight:600;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

/* 小贴士 */
.tip-bar{
  background:linear-gradient(135deg,#fef3c7,#fed7aa); border-radius:16px; padding:12px 16px;
  margin-bottom:16px; font-size:12px; color:#92400e; display:flex; align-items:center; gap:8px;
  box-shadow:0 4px 14px rgba(245,158,11,.15);
}
.tip-bar .tip-icon{font-size:18px; flex-shrink:0;}

/* === 学习面板 === */
.study-overlay{
  position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.6);
  display:none; z-index:150; backdrop-filter:blur(6px);
}
.study-overlay.show{display:flex; flex-direction:column;}

.study-panel{
  background:#fff; border-radius:24px 24px 0 0; margin-top:auto; max-height:92vh;
  overflow:hidden; display:flex; flex-direction:column; animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(100%);} to{transform:translateY(0);}}

.study-header{
  padding:16px 20px 12px; position:sticky; top:0; background:#fff; z-index:10;
  border-bottom:1px solid #f3f4f6;
}
.study-header-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.study-header-top h2{font-size:18px; font-weight:800;}
.study-close{
  width:32px; height:32px; border:none; border-radius:50%; background:#f3f4f6;
  font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}

/* 学科Tab */
.subject-tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;}
.subject-tab{
  padding:8px 16px; border:none; border-radius:20px; font-size:13px; font-weight:600;
  cursor:pointer; white-space:nowrap; background:#f3f4f6; color:#6b7280; transition:all .2s;
  display:flex; align-items:center; gap:5px;
}
.subject-tab.active{color:#fff;}

/* 比例条 */
.ratio-bar{display:flex; gap:4px; margin-bottom:12px; padding:0 20px;}
.ratio-segment{
  flex:1; padding:6px 10px; border-radius:10px; font-size:11px; font-weight:700; text-align:center;
}
.ratio-segment.review{background:#dbeafe; color:#1e40af;}
.ratio-segment.preview{background:#fef3c7; color:#92400e;}
.ratio-segment .ratio-percent{font-size:14px;}

/* 学习内容区 */
.study-body{flex:1; overflow-y:auto; padding:12px 20px 24px;}
.study-section-title{
  font-size:14px; font-weight:800; margin:16px 0 10px; display:flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:12px;
}
.study-section-title.review{background:linear-gradient(135deg,#dbeafe,#bfdbfe); color:#1e40af;}
.study-section-title.preview{background:linear-gradient(135deg,#fef3c7,#fde68a); color:#92400e;}

/* 知识点卡片 */
.kp-card{
  background:#f9fafb; border-radius:16px; margin-bottom:10px; overflow:hidden;
  transition:all .2s; border:2px solid transparent;
}
.kp-card.done{border-color:#86efac; background:#f0fdf4;}
.kp-header{
  display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer;
}
.kp-check{
  width:24px; height:24px; border-radius:50%; border:2.5px solid #d1d5db; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; transition:all .2s;
}
.kp-card.done .kp-check{background:#16a34a; border-color:#16a34a; color:#fff;}
.kp-info{flex:1; min-width:0;}
.kp-topic{font-size:14px; font-weight:700;}
.kp-desc{font-size:11px; color:#9ca3af; margin-top:1px;}
.kp-expand{font-size:12px; color:#9ca3af; transition:transform .2s;}
.kp-card.expanded .kp-expand{transform:rotate(90deg);}

.kp-body{display:none; padding:0 14px 14px;}
.kp-card.expanded .kp-body{display:block;}
.kp-detail{
  font-size:13px; color:#4b5563; line-height:1.7; padding:12px; background:#fff;
  border-radius:12px; margin-bottom:10px;
}
.kp-detail strong{color:#1f2937;}

/* 练习题 */
.kp-exercise{
  background:#fff7ed; border-radius:12px; padding:12px; border:1.5px solid #fed7aa;
}
.kp-exercise .ex-label{font-size:11px; font-weight:700; color:#ea580c; margin-bottom:6px;}
.kp-exercise .ex-question{font-size:13px; font-weight:600; margin-bottom:10px; line-height:1.5;}
.kp-options{display:flex; flex-direction:column; gap:6px;}
.kp-option{
  padding:8px 12px; border:1.5px solid #e5e7eb; border-radius:10px; font-size:12px;
  cursor:pointer; transition:all .2s; background:#fff;
}
.kp-option:hover{border-color:#fdba74; background:#fff7ed;}
.kp-option.correct{border-color:#16a34a; background:#dcfce7; color:#16a34a; font-weight:700;}
.kp-option.wrong{border-color:#ef4444; background:#fee2e2; color:#ef4444;}
.kp-option.disabled{pointer-events:none;}

/* 进度统计 */
.study-progress{
  display:flex; gap:8px; padding:0 20px 12px;
}
.sp-box{
  flex:1; border-radius:12px; padding:10px; text-align:center;
}
.sp-box.review{background:#eff6ff;}
.sp-box.preview{background:#fffbeb;}
.sp-box .sp-val{font-size:18px; font-weight:800;}
.sp-box .sp-label{font-size:10px; color:#6b7280; margin-top:2px;}

/* 卡片上的学习入口按钮 */
.study-btn{
  width:100%; padding:11px; border:none; border-radius:14px; font-size:13px; font-weight:700;
  cursor:pointer; color:#fff; margin-top:10px; transition:all .2s;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.c1 .study-btn{background:linear-gradient(135deg,#7c3aed,#db2777);}
.c2 .study-btn{background:linear-gradient(135deg,#ea580c,#e11d48);}
.c3 .study-btn{background:linear-gradient(135deg,#0284c7,#059669);}
.study-btn:hover{filter:brightness(1.1); transform:translateY(-1px);}

/* 书籍详情面板 */
.book-overlay{
  position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.6);
  display:none; z-index:160; align-items:flex-end; justify-content:center; backdrop-filter:blur(6px);
}
.book-overlay.show{display:flex;}
.book-detail-panel{
  background:#fff; border-radius:24px 24px 0 0; max-width:500px; width:100%; max-height:85vh;
  overflow-y:auto; animation:slideUp .3s ease; padding:0;
}
.book-detail-header{
  padding:20px 20px 16px; position:relative; text-align:center;
}
.book-detail-close{
  position:absolute; top:16px; right:16px; width:32px; height:32px; border:none;
  border-radius:50%; background:#f3f4f6; font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.book-detail-emoji{font-size:48px; margin-bottom:8px;}
.book-detail-title{font-size:18px; font-weight:800; line-height:1.4;}
.book-detail-author{font-size:12px; color:#9ca3af; margin-top:4px;}
.book-detail-tags{display:flex; gap:6px; justify-content:center; margin-top:8px; flex-wrap:wrap;}
.book-detail-tag{
  font-size:10px; padding:3px 10px; border-radius:10px; font-weight:600;
}
.book-detail-tag.age{background:#dbeafe; color:#1e40af;}
.book-detail-tag.pages{background:#f3e8ff; color:#7c3aed;}
.book-detail-body{padding:0 20px 24px;}
.book-detail-section{margin-bottom:14px;}
.book-detail-section h4{
  font-size:13px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:4px;
}
.book-detail-section p{font-size:13px; color:#4b5563; line-height:1.7;}
.book-detail-section.tip{background:#fffbeb; border-radius:12px; padding:12px; border:1px solid #fde68a;}
.book-detail-section.tip p{color:#92400e;}

/* === 宠物系统 CSS === */
.pet-mini-card{display:flex;align-items:center;gap:10px;background:var(--bg-card,#fff);border-radius:16px;padding:10px 14px;margin:10px 0;cursor:pointer;transition:transform .2s,box-shadow .2s;border:2px solid transparent;}
.pet-mini-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.1);}
.pet-mini-card.pet-empty{justify-content:center;flex-direction:column;text-align:center;border:2px dashed #d1d5db;background:#f9fafb;}
.pet-mini-card .pet-avatar{font-size:36px;line-height:1;animation:petBob 2s ease-in-out infinite;}
@keyframes petBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.pet-mini-card .pet-meta{flex:1;min-width:0;}
.pet-mini-card .pet-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;}
.pet-mini-card .pet-lv-badge{font-size:11px;padding:1px 8px;border-radius:8px;background:#f3f4f6;color:#6b7280;font-weight:600;}
.pet-mini-card .pet-satiety-track{height:8px;background:#e5e7eb;border-radius:4px;margin-top:6px;overflow:hidden;position:relative;}
.pet-mini-card .pet-satiety-fill{height:100%;border-radius:4px;transition:width .5s;}
.pet-mini-card .pet-mood-text{font-size:11px;color:#9ca3af;margin-top:3px;}
.pet-mini-card .pet-quick-btns{display:flex;gap:6px;}
.pet-mini-card .pet-quick-btn{width:32px;height:32px;border-radius:10px;border:none;font-size:16px;cursor:pointer;background:#f3f4f6;transition:transform .15s;}
.pet-mini-card .pet-quick-btn:hover{transform:scale(1.1);}

/* 宠物详情面板 */
.pet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.pet-overlay.show{display:flex;animation:fadeIn .3s;}
.pet-panel{background:#fff;width:100%;max-width:520px;max-height:88vh;border-radius:24px 24px 0 0;overflow-y:auto;padding:20px;animation:slideUp .35s ease;}
.pet-panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.pet-panel-header h2{font-size:18px;font-weight:700;}
.pet-close-btn{width:32px;height:32px;border-radius:50%;border:none;background:#f3f4f6;font-size:16px;cursor:pointer;}
.pet-big-avatar{text-align:center;font-size:72px;line-height:1;margin:10px 0;animation:petBob 2s ease-in-out infinite;}
.pet-display-name{text-align:center;font-size:20px;font-weight:800;margin-bottom:4px;}
.pet-display-sub{text-align:center;font-size:13px;color:#9ca3af;margin-bottom:14px;}
.pet-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.pet-stat-item{background:#f9fafb;border-radius:12px;padding:10px;}
.pet-stat-label{font-size:11px;color:#9ca3af;}
.pet-stat-value{font-size:16px;font-weight:700;margin-top:2px;}
.pet-bar-wrap{margin:6px 0;}
.pet-bar-label{font-size:11px;color:#6b7280;display:flex;justify-content:space-between;margin-bottom:3px;}
.pet-bar-track{height:10px;background:#e5e7eb;border-radius:5px;overflow:hidden;}
.pet-bar-fill{height:100%;border-radius:5px;transition:width .5s;}
.pet-tab-row{display:flex;gap:8px;margin:14px 0;}
.pet-tab-btn{flex:1;padding:10px;border-radius:12px;border:2px solid #e5e7eb;background:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.pet-tab-btn.active{border-color:var(--accent,#a855f7);background:var(--soft,rgba(168,85,247,.1));color:var(--accent,#a855f7);}
.pet-food-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;}
.pet-food-card{background:#f9fafb;border-radius:14px;padding:12px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent;}
.pet-food-card:hover{transform:translateY(-3px);box-shadow:0 4px 12px rgba(0,0,0,.08);}
.pet-food-card.disabled{opacity:.4;cursor:not-allowed;}
.pet-food-emoji{font-size:32px;}

// 获取宠物当前形态（根据等级进化）
function getPetStage(petType, level){
  const pt = PET_TYPES[petType];
  if(!pt || !pt.stages) return { face: pt ? pt.face : '❓', name: pt ? pt.name : '', emoji: pt ? pt.emoji : '❓' };
  let stage = pt.stages[0];
  for(const s of pt.stages){
    if(level >= s.minLevel) stage = s;
  }
  return stage;
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      appData = JSON.parse(raw);
      // 版本迁移：确保新字段存在
      DEFAULT_DATA.children.forEach((dc, i) => {
        if(!appData.children[i]){
          appData.children[i] = JSON.parse(JSON.stringify(dc));
        } else {
          const c = appData.children[i];
          // 更新基本信息（姓名等）
          c.name = dc.name;
          c.nick = dc.nick;
          c.avatar = dc.avatar;
          c.bannerArt = dc.bannerArt;
          c.grade = dc.grade;
          // 确保字段存在
          if(!c.books) c.books = dc.books;
          if(!c.studyState) c.studyState = {};
          if(!c.bookNotes) c.bookNotes = {};
      if(!c.pet) c.pet = JSON.parse(JSON.stringify(dc.pet));
      if(!c.foodBag) c.foodBag = JSON.parse(JSON.stringify(dc.foodBag));
      if(!c.questState) c.questState = JSON.parse(JSON.stringify(dc.questState));
      if(c.pet && !c.pet.mood) c.pet.mood = 'happy';
      if(c.pet && !c.pet.pkWins) c.pet.pkWins = 0;
      if(c.pet && !c.pet.totalFoodFed) c.pet.totalFoodFed = 0;
          if(!c.readingLog) c.readingLog = {};
          if(!c.tasks) c.tasks = dc.tasks;
          // 合并新任务（保留自定义和完成状态）
          dc.tasks.forEach(dt => {
            if(!c.tasks.find(t => t.id === dt.id)){
              c.tasks.push(dt);
            }
          });
          // 合并新书
          dc.books.forEach(db => {
            if(!c.books.find(b => b.title === db.title)){
              c.books.push(db);
            }
          });
        }
      });
    } else {
      appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
  } catch(e){
    appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  checkDailyReset();
}

function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
}

function getToday(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function checkDailyReset(){
  const today = getToday();
  if(appData.lastResetDate !== today){
    appData.children.forEach(child => {
      child.tasks.forEach(t => t.done = false);
    });
    appData.lastResetDate = today;
  // 重置闯关次数
  appData.children.forEach(c => {
    if(c.questState && c.questState.lastClearDate !== today){
      c.questState.todayCleared = [];
    }
  });
    saveData();
  }
  const now = new Date();
  const weekKey = `${now.getFullYear()}-W${getWeekNumber(now)}`;
  if(appData.weekStart !== weekKey){
    appData.children.forEach(c => c.weekPoints = 0);
    appData.weekStart = weekKey;
    saveData();
  }
}

function getWeekNumber(d){
  const date = new Date(d.getTime());
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
  const week1 = new Date(date.getFullYear(),0,4);
  return 1 + Math.round(((date - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
}

function getLevelInfo(points){
  const level = Math.floor(points / 100) + 1;
  const currentLevelPoints = points % 100;
  const need = 100;
  const percent = (currentLevelPoints / need) * 100;
  const titles = ['小萌新','学习小兵','勤奋学徒','知识探索者','智慧少年','学霸达人','知识小博士','超级学神'];
  const title = titles[Math.min(level - 1, titles.length - 1)];
  return { level, title, currentLevelPoints, need, percent };
}

function renderTip(){

}

function renderLeaderboard(){
  const sorted = [...appData.children].sort((a,b) => b.weekPoints - a.weekPoints);
  const badges = ['🥇','🥈','🥉'];
  const rankClasses = ['rank-1','rank-2','rank-3'];
  const html = sorted.map((c, i) => `
    <div class="rank-item ${rankClasses[i]}">
      <div class="rank-badge">${badges[i]}</div>
      <div class="rank-num">${c.weekPoints}</div>
      <div class="rank-name">${c.avatar} ${c.nick}</div>
      <div class="rank-score">本周积分</div>
    </div>
  `).join('');
  document.getElementById('rankList').innerHTML = html;
}

function renderSessionProgress(){
  // 计算每个孩子上午/下午任务完成率，取平均
  let amTotal = 0, amDone = 0, pmTotal = 0, pmDone = 0;
  appData.children.forEach(c => {
    c.tasks.forEach(t => {
      if(t.session === 'am'){
        amTotal++;
        if(t.done) amDone++;
      } else {
        pmTotal++;
        if(t.done) pmDone++;
      }
    });
  });
  const amPercent = amTotal > 0 ? (amDone / amTotal) * 100 : 0;
  const pmPercent = pmTotal > 0 ? (pmDone / pmTotal) * 100 : 0;
  document.getElementById('amProgress').style.width = amPercent + '%';
  document.getElementById('pmProgress').style.width = pmPercent + '%';
}

function renderChildren(){
  const grid = document.getElementById('childrenGrid');
  grid.innerHTML = appData.children.map(child => renderChildCard(child)).join('');
}

function renderChildCard(child){

      <div class="card-body">
        <div class="child-header">
          <div class="child-avatar">${child.avatar}</div>
          <div class="child-info">
            <div class="child-name">${child.name}</div>
            <div class="child-nick">「${child.nick}」</div>
            <div class="child-meta">${child.grade} · ${child.age}岁</div>

          ${child.streak >= 2 ? `<div class="streak-badge">🔥${child.streak}天</div>` : ''}

        <div class="level-bar">

            <span>${levelInfo.currentLevelPoints}/${levelInfo.need}</span>

            <div class="progress-fill" style="width:${levelInfo.percent}%"></div>

        <div class="stats-row">
          <div class="stat-box">

function toggleTask(childId, taskId){
  const child = appData.children.find(c => c.id === childId);
  if(!child) return;
  const task = child.tasks.find(t => t.id === taskId);
  if(!task) return;

  task.done = !task.done;
  if(task.done){
    child.totalPoints += task.points;
    child.weekPoints += task.points;
    showCelebration('⭐', `太棒了！+${task.points}分`);
    spawnFireworks();
  } else {
    child.totalPoints -= task.points;
    child.weekPoints -= task.points;
  }

  const allDone = child.tasks.every(t => t.done);
  if(allDone && child.tasks.length > 0){
    child.totalPoints += 5;
    child.weekPoints += 5;
    setTimeout(() => {
      showCelebration('🎉', `${child.nick}全部完成！+5！`);
      spawnFireworks();
    }, 800);
  }

  const today = getToday();
  if(child.lastCheckIn !== today && allDone){
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yKey = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;
    if(child.lastCheckIn === yKey){
      child.streak += 1;
    } else {
      child.streak = 1;
    }
    child.lastCheckIn = today;
  }

  saveData();
  render();
}

function addReading(childId){
  const input = document.getElementById(`readingInput_${childId}`);
  const mins = parseInt(input.value);
  if(!mins || mins <= 0){
    showToast('请输入有效的分钟数');
    return;
  }
  const child = appData.children.find(c => c.id === childId);
  const today = getToday();
  child.readingLog[today] = (child.readingLog[today] || 0) + mins;
  child.readingMinutes += mins;
  // 基础分：每10分钟5分
  const timePoints = Math.floor(mins / 10) * 5;
  // 章节奖励：每20分钟算1个章节，每章+5分
  const chapters = Math.floor(mins / 20);
  const chapterPoints = chapters * 5;
  const points = timePoints + chapterPoints;
  child.totalPoints += points;
  child.weekPoints += points;
  input.value = '';
  saveData();
  showCelebration('📚', `阅读${mins}分钟 +${points}分（含${chapters}章奖励）`);
  render();
}

function cycleBookStatus(childId, bookIndex){
  const child = appData.children.find(c => c.id === childId);
  const book = child.books[bookIndex];
  const states = ['unread', 'reading', 'done'];
  const curIdx = states.indexOf(book.status);
  const newStatus = states[(curIdx + 1) % 3];
  const oldStatus = book.status;
  book.status = newStatus;

  if(newStatus === 'done' && oldStatus !== 'done'){
    child.totalPoints += 20;
    child.weekPoints += 20;
    showCelebration('📖', `读完一本书！+20分`);
    spawnFireworks();
  }
  saveData();
  render();
}

function addTask(childId){
  const text = prompt('请输入任务名称：');
  if(!text) return;
  const pointsStr = prompt('完成任务获得多少积分？', '10');
  const points = parseInt(pointsStr);
  if(!points) return;
  const session = confirm('点击"确定"=上午任务，点击"取消"=下午任务') ? 'am' : 'pm';
  const child = appData.children.find(c => c.id === childId);
  child.tasks.push({
    id: 'custom_' + Date.now(),
    text: text,
    points: points,
    done: false,
    session: session
  });
  saveData();
  render();
  showToast('任务已添加');
}

function exportData(){
  const dataStr = JSON.stringify(appData, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `三宝学习记录_${getToday()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出，可分享给其他设备导入');
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const imported = JSON.parse(e.target.result);
      if(!imported.children || !Array.isArray(imported.children)){
        showToast('数据格式不正确');
        return;
      }
      showModal('确认导入', `<p>检测到数据来自 <strong>${imported.lastResetDate || '未知日期'}</strong>。</p><p>导入后将覆盖当前数据，确定继续吗？</p>`,
        `<div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">取消</button><button class="btn-primary" onclick='doImport(${JSON.stringify(JSON.stringify(imported)).replace(/'/g,"\\'")})'>确认导入</button></div>`);
    } catch(err){
      showToast('文件解析失败');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function doImport(jsonStr){
  appData = JSON.parse(jsonStr);
  saveData();
  closeModal();
  render();
  showToast('数据导入成功！');
}

function saveBookNote(childId, bookIndex, bookTitle){

  child.bookNotes[bookTitle] = noteEl.value;
  // 写笔记也加分
  if(noteEl.value.length > 10 && !child.bookNotes['__scored_' + bookTitle]){
    child.totalPoints += 5;
    child.weekPoints += 5;
    child.bookNotes['__scored_' + bookTitle] = true;
    saveData();
    showCelebration('✏️', '读书笔记已保存 +5分');
    spawnFireworks();
  } else {
    saveData();
    showToast('笔记已保存');

}

let currentStudyChild = null;
let currentSubject = null;

function openStudy(childId){
  currentStudyChild = childId;
  const child = appData.children.find(c => c.id === childId);
  if(!child) return;
  document.getElementById('studyTitle').textContent = `${child.avatar} ${child.name}（${child.nick}）的学习内容`;
  renderSubjectTabs(childId);
  document.getElementById('studyOverlay').classList.add('show');
}

function closeStudy(){
  document.getElementById('studyOverlay').classList.remove('show');
  currentStudyChild = null;
  currentSubject = null;
}

function renderSubjectTabs(childId){
  const content = STUDY_CONTENT[childId];
  if(!content) return;
  const subjectKeys = Object.keys(content);
  if(!currentSubject || !content[currentSubject]) currentSubject = subjectKeys[0];
  
  const tabsHtml = subjectKeys.map(key => {
    const subj = content[key];
    const isActive = key === currentSubject;
    return `<button class="subject-tab ${isActive ? 'active' : ''}" 
      style="${isActive ? 'background:' + subj.color : ''}" 
      onclick="switchSubject('${key}')">${subj.icon} ${subj.name}</button>`;
  }).join('');
  document.getElementById('subjectTabs').innerHTML = tabsHtml;
  
  renderStudyContent(childId);
}

function switchSubject(key){
  currentSubject = key;
  renderSubjectTabs(currentStudyChild);
}

function renderStudyContent(childId){
  const child = appData.children.find(c => c.id === childId);
  const content = STUDY_CONTENT[childId];
  if(!content || !content[currentSubject]) return;
  const subj = content[currentSubject];
  
  // 比例条
  const reviewCount = subj.review.length;
  const previewCount = subj.preview.length;
  const total = reviewCount + previewCount;
  const reviewPct = total > 0 ? Math.round(reviewCount / total * 100) : 0;
  const previewPct = total > 0 ? 100 - reviewPct : 0;
  
  document.getElementById('ratioBar').innerHTML = `
    <div class="ratio-segment review">
      <div class="ratio-percent">${reviewPct}%</div>
      <div>📋 复习</div>
    </div>
    <div class="ratio-segment preview">
      <div class="ratio-percent">${previewPct}%</div>
      <div>🔮 预习</div>
    </div>
  `;
  
  // 进度统计
  const studyState = child.studyState || {};
  const subjState = studyState[currentSubject] || { review: {}, preview: {} };
  const reviewDone = subj.review.filter(kp => subjState.review[kp.id]).length;
  const previewDone = subj.preview.filter(kp => subjState.preview[kp.id]).length;
  
  document.getElementById('studyProgress').innerHTML = `
    <div class="sp-box review">
      <div class="sp-val">${reviewDone}/${reviewCount}</div>
      <div class="sp-label">复习完成</div>
    </div>
    <div class="sp-box preview">
      <div class="sp-val">${previewDone}/${previewCount}</div>
      <div class="sp-label">预习完成</div>
    </div>
  `;
  
  // 渲染知识点
  let bodyHtml = '';
  if(subj.review.length > 0){
    bodyHtml += '<div class="study-section-title review">📋 复习区（' + reviewDone + '/' + reviewCount + '）</div>';
    bodyHtml += subj.review.map(kp => renderKpCard(childId, kp, 'review', subjState.review[kp.id])).join('');
  }
  if(subj.preview.length > 0){
    bodyHtml += '<div class="study-section-title preview">🔮 预习区（' + previewDone + '/' + previewCount + '）</div>';
    bodyHtml += subj.preview.map(kp => renderKpCard(childId, kp, 'preview', subjState.preview[kp.id])).join('');
  }
  if(total === 0){
    bodyHtml = '<div style="text-align:center;padding:40px;color:#9ca3af;">暂无学习内容</div>';
  }
  
  document.getElementById('studyBody').innerHTML = bodyHtml;
}

function renderKpCard(childId, kp, type, isDone){
  const doneClass = isDone ? 'done' : '';
  return `
    <div class="kp-card ${doneClass}" id="kp_${kp.id}">
      <div class="kp-header" onclick="toggleKp('${kp.id}')">
        <div class="kp-check">${isDone ? '✓' : ''}</div>
        <div class="kp-info">
          <div class="kp-topic">${kp.topic}</div>
          <div class="kp-desc">${kp.desc}</div>
        </div>
        <div class="kp-expand">▶</div>
      </div>
      <div class="kp-body">
        <div class="kp-detail">${kp.detail}</div>
        ${kp.exercise ? renderExercise(kp) : ''}
        <button class="add-task-btn" style="margin-top:8px;" onclick="markKpDone('${childId}','${kp.id}','${type}')">
          ${isDone ? '✅ 已掌握' : '标记为已掌握 +5分'}
        </button>
      </div>
    </div>
  `;
}

function renderExercise(kp){
  const ex = kp.exercise;
  const optsHtml = ex.options.map((opt, i) => 
    `<div class="kp-option" onclick="checkAnswer(this, ${i}, ${ex.answer}, '${kp.id}')">${String.fromCharCode(65+i)}. ${opt}</div>`
  ).join('');
  return `
    <div class="kp-exercise" id="ex_${kp.id}">
      <div class="ex-label">📝 练习题（答对+3分）</div>
      <div class="ex-question">${ex.q}</div>
      <div class="kp-options">${optsHtml}</div>
    </div>
  `;
}

function checkAnswer(el, chosen, correct, kpId){
  const container = el.parentElement;
  const options = container.querySelectorAll('.kp-option');
  options.forEach(o => o.classList.add('disabled'));
  
  if(chosen === correct){
    el.classList.add('correct');
    // 练习奖励
    const child = appData.children.find(c => c.id === currentStudyChild);
    child.totalPoints += 3;
    child.weekPoints += 3;
    saveData();
    showCelebration('🎯', '答对了！+3分');
    spawnFireworks();
    setTimeout(() => { renderLeaderboard(); }, 100);
  } else {
    el.classList.add('wrong');
    options[correct].classList.add('correct');
    showToast('再想想，正确答案已标出');
  }
}

function toggleKp(kpId){
  const card = document.getElementById('kp_' + kpId);
  if(card) card.classList.toggle('expanded');
}

function markKpDone(childId, kpId, type){
  const child = appData.children.find(c => c.id === childId);
  if(!child.studyState) child.studyState = {};
  if(!child.studyState[currentSubject]) child.studyState[currentSubject] = { review: {}, preview: {} };
  const state = child.studyState[currentSubject][type];
  
  if(state[kpId]){
    // 取消标记
    state[kpId] = false;
    child.totalPoints -= 5;
    child.weekPoints -= 5;
  } else {
    // 标记完成
    state[kpId] = true;
    child.totalPoints += 5;
    child.weekPoints += 5;
    showCelebration('💡', '掌握了一个知识点！+5分');
    spawnFireworks();
  }
  
  saveData();
  renderSubjectTabs(childId);
  renderLeaderboard();
  renderChildren();
}

// 烟花粒子效果
function spawnFireworks(){
  const colors = ['#a855f7','#ec4899','#f97316','#f43f5e','#0ea5e9','#10b981','#f59e0b','#fbbf24'];
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  for(let i = 0; i < 16; i++){
    const p = document.createElement('div');
    p.className = 'firework';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    document.body.appendChild(p);
    const angle = (Math.PI * 2 * i) / 16;
    const dist = 80 + Math.random() * 80;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    p.animate([
      { transform:'translate(0,0) scale(1)', opacity:1 },
      { transform:`translate(${dx}px,${dy}px) scale(0)`, opacity:0 }
    ], { duration:800, easing:'cubic-bezier(0,.5,.5,1)' });
    setTimeout(() => p.remove(), 800);
  }
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function getPetMood(pet){
  if(pet.satiety <= 20) return 'hungry';
  if(pet.satiety <= 40) return 'sad';
  if(pet.satiety >= 90) return 'full';
  if(pet.satiety >= 70) return 'excited';
  return 'happy';
}

function decaySatiety(pet){
  if(!pet.lastFedTime) return;
  const hours = (Date.now() - new Date(pet.lastFedTime).getTime()) / 3600000;
  if(hours > 0){
    pet.satiety = Math.max(0, pet.satiety - Math.floor(hours * 1));
    pet.mood = getPetMood(pet);
  }
}

function initPetSystem(){
  appData.children.forEach(c => {
    if(c.pet && c.pet.type){
      decaySatiety(c.pet);
      // 数据迁移：补充新字段
      if(c.pet.weapon === undefined) c.pet.weapon = null;
    }
    if(c.lastChoreDate === undefined) c.lastChoreDate = '';
    // 盔甲迁移：旧4级盔甲映射到新3级
    if(c.pet && c.pet.armor){
      const armorMap = { flower: 'leaf', star: 'star' }; // flower→leaf(普通), star保留, rainbow→rainbow改名
      if(armorMap[c.pet.armor]) c.pet.armor = armorMap[c.pet.armor];
    }
  });
  saveData();
}

// 首次访问自动弹出指南
function checkFirstTimeGuide(){
  if(!localStorage.getItem('petGuideShown')){
    setTimeout(() => { showPetGuide(); localStorage.setItem('petGuideShown','1'); }, 800);
  }
}

// === 宠物选择 ===
function choosePet(childId){
  const child = appData.children.find(c => c.id === childId);
  if(!child) return;
  let html = `<div class="pet-panel-header"><h2>🐾 选择你的小伙伴</h2><button class="pet-close-btn" onclick="closePetPanel()">✕</button></div>`;
  html += `<p style="text-align:center;color:#6b7280;font-size:13px;">选一只宠物陪你一起学习吧！</p>`;
  html += `<div class="pet-choose-grid">`;
  Object.keys(PET_TYPES).forEach(key => {
    const pt = PET_TYPES[key];
    html += `<div class="pet-choose-card" onclick="confirmPet('${childId}','${key}')">
      <div class="pet-choose-emoji">${pt.emoji}</div>
      <div class="pet-choose-name">${pt.name}</div>
      <div class="pet-choose-desc">${pt.desc}</div>
    </div>`;
  });
  html += `</div>`;
  document.getElementById('petPanel').innerHTML = html;
  document.getElementById('petOverlay').classList.add('show');
}

function confirmPet(childId, petType){
  const child = appData.children.find(c => c.id === childId);
  if(!child) return;
  const pt = PET_TYPES[petType];
  let name = '';
  const nameHtml = `<div class="pet-panel-header"><h2>🐾 给${pt.name}起个名字</h2><button class="pet-close-btn" onclick="closePetPanel()">✕</button></div>
    <div style="text-align:center;font-size:64px;margin:20px 0;">${pt.emoji}</div>
    <div style="text-align:center;margin-bottom:16px;">
      <input type="text" id="petNameInput" placeholder="给它起个名字吧~" maxlength="8"
        style="width:80%;padding:12px 16px;border-radius:12px;border:2px solid #e5e7eb;font-size:16px;text-align:center;">
    </div>
    <button onclick="savePetName('${childId}','${petType}')" style="display:block;width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;font-size:16px;font-weight:700;cursor:pointer;">确定啦！</button>`;
  document.getElementById('petPanel').innerHTML = nameHtml;
  document.getElementById('petOverlay').classList.add('show');
  setTimeout(() => { const inp = document.getElementById('petNameInput'); if(inp) inp.focus(); }, 100);
}

function savePetName(childId, petType){
  const child = appData.children.find(c => c.id === childId);
  if(!child) return;
  const nameInp = document.getElementById('petNameInput');
  const name = nameInp ? nameInp.value.trim() : '';
  const pt = PET_TYPES[petType];
  child.pet = {
    type: petType, name: name || pt.name, level: 1, exp: 0, satiety: 60,
    mood: 'happy', lastFedTime: new Date().toISOString(),
    armor: null, skillSlot: pt.baseSkill, pkWins: 0, pkLosses: 0,
    feedCount: 0, totalFoodFed: 0,
  };
  saveData();
  closePetPanel();
  showCelebration(pt.emoji, `${child.pet.name}来啦！一起加油吧！`);
  spawnFireworks();
  render();
}

// === 宠物迷你卡 ===
function renderPetMiniCard(child){
  if(!child.pet || !child.pet.type){
    return `<div class="pet-mini-card pet-empty" onclick="choosePet('${child.id}')">
      <div style="font-size:32px;">❓</div>
      <div style="font-size:13px;font-weight:600;">还没有宠物</div>
      <div style="font-size:11px;color:#9ca3af;">点击选择你的小伙伴！</div>
    </div>`;
  }
  const pet = child.pet;
  const pt = PET_TYPES[pet.type];
  const mood = getPetMood(pet);
  const satColor = pet.satiety > 60 ? '#22c55e' : pet.satiety > 30 ? '#f59e0b' : '#ef4444';
  const armorEmoji = pet.armor ? ARMORS[pet.armor].emoji : '';
  const weaponEmoji = pet.weapon ? WEAPONS[pet.weapon].emoji : '';
  return `<div class="pet-mini-card" onclick="openPetDetail('${child.id}')">
    <div class="pet-avatar">${pt.moodEmoji[mood]}</div>
    <div class="pet-meta">
      <div class="pet-name">${pet.name} ${armorEmoji}${weaponEmoji} <span class="pet-lv-badge">Lv.${pet.level}</span></div>
      <div class="pet-satiety-track"><div class="pet-satiety-fill" style="width:${pet.satiety}%;background:${satColor};"></div></div>
      <div class="pet-mood-text">🍖 ${pet.satiety}/100 · ${MOOD_TEXT[mood]}</div>
    </div>
    <div class="pet-quick-btns">
      <button class="pet-quick-btn" onclick="event.stopPropagation();openPetDetail('${child.id}')" title="查看">🐾</button>
      <button class="pet-quick-btn" onclick="event.stopPropagation();quickFeed('${child.id}')" title="喂食">🍖</button>
    </div>
  </div>`;
}

function quickFeed(childId){
  const child = appData.children.find(c => c.id === childId);
  if(!child || !child.pet || !child.pet.type) return;
  const pt = PET_TYPES[child.pet.type];
  const preferFood = pt.preferFood;
  if(child.foodBag[preferFood] > 0){
    feedPet(childId, preferFood);
  } else {
    // 没有偏好食物，尝试任何有的
    for(const fid of ['cake','seed','bone','veggie','fish']){
      if(child.foodBag[fid] > 0){
        feedPet(childId, fid);
        return;
      }
    }
    showToast('没有食物了！去闯关或写读后感获取食物吧~');
    openPetDetail(childId);
  }
}

// === 宠物详情面板 ===
function openPetDetail(childId){
  const child = appData.children.find(c => c.id === childId);
  if(!child) return;
  if(!child.pet || !child.pet.type){
    choosePet(childId);
    return;
  }
  renderPetPanel(childId);
  document.getElementById('petOverlay').classList.add('show');
}

function openPetWorld(){
  // 默认打开第一个孩子
  openPetDetail('c1');
}

function closePetPanel(){
  document.getElementById('petOverlay').classList.remove('show');
}

let petPanelTab = 'home';

function renderPetPanel(childId){
  const child = appData.children.find(c => c.id === childId);
  if(!child || !child.pet || !child.pet.type) return;
  const pet = child.pet;
  const pt = PET_TYPES[pet.type];
  const mood = getPetMood(pet);
  decaySatiety(pet);

  let html = `<div class="pet-panel-header">
    <h2>${child.nick}的宠物</h2>
    <div style="display:flex;gap:6px;">
      <button class="pet-close-btn" onclick="switchPetChild('${childId}')" title="切换" style="font-size:14px;">🔄</button>
      <button class="pet-close-btn" onclick="closePetPanel()">✕</button>
    </div>
  </div>`;

  // 宠物大头像
  const stage = getPetStage(pet.type, pet.level);
  html += `<div class="pet-big-avatar">${stage.face}</div>`;
  html += `<div class="pet-display-name">${pet.name} ${pet.armor ? ARMORS[pet.armor].emoji : ''} ${pet.weapon ? WEAPONS[pet.weapon].emoji : ''}</div>`;
  html += `<div class="pet-display-sub">${stage.name} · Lv.${pet.level} · ${MOOD_TEXT[mood]}</div>`;

  // 等级和经验：Lv(n)→(n+1)需 10+(n-1)*5
  const expNeeded = 10 + (pet.level - 1) * 5;
  const expPct = Math.min(100, (pet.exp / expNeeded) * 100);
  html += `<div class="pet-bar-wrap">
    <div class="pet-bar-label"><span>⭐ 经验</span><span>${pet.exp}/${expNeeded}</span></div>
    <div class="pet-bar-track"><div class="pet-bar-fill" style="width:${expPct}%;background:linear-gradient(90deg,#a855f7,#ec4899);"></div></div>
  </div>`;

  // 饱食度
  const satColor = pet.satiety > 60 ? '#22c55e' : pet.satiety > 30 ? '#f59e0b' : '#ef4444';
  html += `<div class="pet-bar-wrap">
    <div class="pet-bar-label"><span>🍖 饱食度</span><span>${pet.satiety}/100</span></div>
    <div class="pet-bar-track"><div class="pet-bar-fill" style="width:${pet.satiety}%;background:${satColor};"></div></div>
  </div>`;

  // 属性
  const cp = calcCombatPower(child);
  html += `<div class="pet-stat-grid">
    <div class="pet-stat-item"><div class="pet-stat-label">⚔️ 攻击</div><div class="pet-stat-value">${cp.attack}</div></div>
    <div class="pet-stat-item"><div class="pet-stat-label">🛡️ 防御</div><div class="pet-stat-value">${cp.defense}</div></div>
    <div class="pet-stat-item"><div class="pet-stat-label">💨 速度</div><div class="pet-stat-value">${cp.speed}</div></div>
    <div class="pet-stat-item"><div class="pet-stat-label">❤️ 体力</div><div class="pet-stat-value">${cp.maxHp}</div></div>
  </div>`;

  // 战绩和装备
  const skillName = pet.skillSlot ? SKILLS[pet.skillSlot].name : '未装备';
  const skillEmoji = pet.skillSlot ? SKILLS[pet.skillSlot].emoji : '';
  const armorName = pet.armor ? ARMORS[pet.armor].name : '未装备';
  const weaponName = pet.weapon ? WEAPONS[pet.weapon].name : '未装备';
  const weaponEmojiStr = pet.weapon ? WEAPONS[pet.weapon].emoji : '';
  html += `<div style="background:#f9fafb;border-radius:12px;padding:10px;margin:10px 0;font-size:13px;">
    <div>⚔️ 武器：<strong>${weaponEmojiStr} ${weaponName}</strong></div>
    <div>🛡️ 铠甲：<strong>${armorName}</strong></div>
    <div>✨ 技能：<strong>${skillEmoji} ${skillName}</strong></div>
    <div>📊 战绩：<strong>${pet.pkWins}胜 ${pet.pkLosses}负</strong></div>
  </div>`;

  // Tab 切换
  html += `<div class="pet-tab-row">
    <button class="pet-tab-btn ${petPanelTab==='home'?'active':''}" onclick="petPanelTab='home';renderPetPanel('${childId}')">🏠 主页</button>
    <button class="pet-tab-btn ${petPanelTab==='feed'?'active':''}" onclick="petPanelTab='feed';renderPetPanel('${childId}')">🍖 喂食</button>
    <button class="pet-tab-btn ${petPanelTab==='shop'?'active':''}" onclick="petPanelTab='shop';renderPetPanel('${childId}')">🛒 商店</button>
    <button class="pet-tab-btn ${petPanelTab==='quest'?'active':''}" onclick="petPanelTab='quest';renderPetPanel('${childId}')">🎮 闯关</button>
  </div>`;

  if(petPanelTab === 'home'){
    // 进化信息
    if(pt.stages){
      html += `<div style="margin-top:10px;background:linear-gradient(135deg,#faf5ff,#fce7f3);border-radius:12px;padding:10px;margin-bottom:10px;">`;
      html += `<div style="font-size:13px;font-weight:700;margin-bottom:6px;">✨ 进化之路</div>`;
      html += `<div style="display:flex;justify-content:space-around;align-items:center;">`;
      pt.stages.forEach((s, i) => {
        const isCurrent = level >= s.minLevel && (i === pt.stages.length-1 || level < pt.stages[i+1].minLevel);
        const isPast = level >= s.minLevel;
        html += `<div style="text-align:center;${isPast?'':'opacity:.3;'}">`;
        html += `<div style="font-size:${isCurrent?'32px':'24px'};${isCurrent?'animation:petBob 1.5s ease-in-out infinite;':''}">${s.emoji}</div>`;
        html += `<div style="font-size:11px;font-weight:${isCurrent?'700':'400'};color:${isCurrent?'#7c3aed':'#6b7280'};">${s.name}</div>`;
        html += `<div style="font-size:10px;color:#9ca3af;">Lv.${s.minLevel}</div>`;
        html += `</div>`;
        if(i < pt.stages.length - 1){
          html += `<span style="color:#c4b5fd;font-size:16px;">→</span>`;
        }
      });
      html += `</div></div>`;
    }

    // 技能列表
    html += `<div style="margin-top:10px;"><div style="font-size:13px;font-weight:700;margin-bottom:8px;">⚔️ 技能列表</div>`;
    pt.skillPool.forEach((skId, i) => {
      const sk = SKILLS[skId];
      const unlocked = pet.level >= (i === 0 ? 1 : i === 1 ? 5 : 10);
      const equipped = pet.skillSlot === skId;
      html += `<div style="display:flex;align-items:center;gap:8px;padding:8px;background:${equipped?'#f3e8ff':'#f9fafb'};border-radius:10px;margin-bottom:6px;${unlocked?'':'opacity:.5;'}">
        <span style="font-size:20px;">${sk.emoji}</span>
        <div style="flex:1;"><div style="font-size:13px;font-weight:600;">${sk.name}</div><div style="font-size:11px;color:#9ca3af;">${sk.desc}${sk.power?` · 威力${sk.power}`:''}</div></div>
        ${equipped ? '<span style="font-size:11px;color:#a855f7;font-weight:600;">已装备</span>' :
          unlocked ? `<button onclick="equipSkill('${childId}','${skId}')" style="padding:4px 10px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;font-size:11px;cursor:pointer;">装备</button>` :
          `<span style="font-size:11px;color:#9ca3af;">Lv.${i===1?5:10}解锁</span>`}
      </div>`;
    });
    html += `</div>`;

  } else if(petPanelTab === 'feed'){
    // 食物背包
    html += `<div style="margin-top:10px;"><div style="font-size:13px;font-weight:700;margin-bottom:8px;">🎒 食物背包（点击喂食）</div>`;
    html += `<div class="pet-food-grid">`;
    Object.keys(FOODS).forEach(fid => {
      const food = FOODS[fid];
      const count = child.foodBag[fid] || 0;
      const isPrefer = pt.preferFood === fid;
      const disabled = count <= 0;
      const clickAttr = disabled ? '' : 'onclick="feedPet(\'' + childId + '\',\'' + fid + '\')"';
      html += `<div class="pet-food-card ${disabled?'disabled':''}" ${clickAttr}>
        <div class="pet-food-emoji">${food.emoji}${isPrefer?'⭐':''}</div>
        <div class="pet-food-name">${food.name}</div>
        <div class="pet-food-count">x${count}</div>
        <div class="pet-food-effect">+${food.satiety}饱食度${isPrefer?' ×1.5':''}</div>
      </div>`;
    });
    html += `</div>`;
    if(pt.preferFood){
      html += `<div style="text-align:center;font-size:11px;color:#9ca3af;margin-top:10px;">⭐ 标记为偏好食物，喂养效果×1.5</div>`;
    }
    html += `</div>`;

  } else if(petPanelTab === 'shop'){
    // 食物商店
    html += `<div style="margin-top:10px;"><div style="font-size:13px;font-weight:700;margin-bottom:4px;">🛒 食物商店（积分：${child.totalPoints}）</div>`;
    html += `<div class="pet-food-grid">`;
    Object.keys(FOODS).forEach(fid => {
      const food = FOODS[fid];
      const canBuy = child.totalPoints >= food.cost;
      html += `<div class="pet-food-card">
        <div class="pet-food-emoji">${food.emoji}</div>
        <div class="pet-food-name">${food.name}</div>
        <div class="pet-food-effect">+${food.satiety}饱食 +${food.exp}经验</div>
        <button class="pet-buy-btn" ${canBuy?'':'disabled'} onclick="buyFood('${childId}','${fid}')">${food.cost}积分购买</button>
      </div>`;
    });
    html += `</div></div>`;

    // 铠甲商店
    html += `<div style="margin-top:16px;"><div style="font-size:13px;font-weight:700;margin-bottom:4px;">🛡️ 铠甲商店</div>`;
    html += `<div class="pet-food-grid">`;
    Object.keys(ARMORS).forEach(aid => {
      const ar = ARMORS[aid];
      const owned = pet.armor === aid;
      const levelLocked = pet.level < ar.minLevel;
      const canBuy = child.totalPoints >= ar.cost && !owned && !levelLocked;
      html += `<div class="pet-food-card ${owned?'':'disabled'}" style="${owned?'border-color:#10b981;':''}${levelLocked?'opacity:.5;':''}">
        <div class="pet-food-emoji">${ar.emoji}</div>
        <div class="pet-food-name">${ar.name}</div>
        <div class="pet-food-effect">防御+${ar.bonus} · ${ar.tier}</div>
        ${owned ? '<div style="font-size:11px;color:#10b981;font-weight:600;">已装备</div>' :
          levelLocked ? `<div style="font-size:11px;color:#ef4444;">🔒 Lv.${ar.minLevel}解锁</div>` :
          `<button class="pet-buy-btn" ${canBuy?'':'disabled'} onclick="buyArmor('${childId}','${aid}')">${ar.cost}积分</button>`}
      </div>`;
    });
    html += `</div></div>`;

    // 武器商店
    html += `<div style="margin-top:16px;"><div style="font-size:13px;font-weight:700;margin-bottom:4px;">⚔️ 武器商店</div>`;
    html += `<div class="pet-food-grid">`;
    Object.keys(WEAPONS).forEach(wid => {
      const wp = WEAPONS[wid];
      const owned = pet.weapon === wid;
      const levelLocked = pet.level < wp.minLevel;
      const canBuy = child.totalPoints >= wp.cost && !owned && !levelLocked;
      html += `<div class="pet-food-card ${owned?'':'disabled'}" style="${owned?'border-color:#f59e0b;':''}${levelLocked?'opacity:.5;':''}">

function speakText(text, voiceOpts){
  try {
    if(!('speechSynthesis' in window)) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    if(voiceOpts){
      utter.rate = voiceOpts.rate || 1.0;
      utter.pitch = voiceOpts.pitch || 1.0;
    }
    // 尝试选中文语音
    const voices = window.speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang.startsWith('zh'));
    if(zhVoice) utter.voice = zhVoice;
    window.speechSynthesis.speak(utter);
  } catch(e) { /* 语音不可用就静默 */ }
}

function feedPet(childId, foodId){
  const child = appData.children.find(c => c.id === childId);
  if(!child || !child.pet) return;
  if(!child.foodBag[foodId] || child.foodBag[foodId] <= 0){
    showToast('没有这个食物了！');
    return;
  }
  const pet = child.pet;
  const food = FOODS[foodId];
  const pt = PET_TYPES[pet.type];
  const isPrefer = pt.preferFood === foodId;
  const satietyGain = Math.floor(food.satiety * (isPrefer ? 1.5 : 1));
  const expGain = Math.floor(food.exp * (isPrefer ? 1.5 : 1));

  // 检查是否今天首次喂养
  const today = getToday();
  const isFirstFeedToday = !child.lastFeedDate || child.lastFeedDate !== today;
  if(isFirstFeedToday){
    child.lastFeedDate = today;
  }

  pet.satiety = Math.min(100, pet.satiety + satietyGain);
  pet.exp += expGain;
  pet.feedCount++;
  pet.totalFoodFed += satietyGain;
  pet.lastFedTime = new Date().toISOString();
  pet.mood = getPetMood(pet);
  child.foodBag[foodId]--;

  checkPetLevelUp(childId);
  saveData();

  const preferText = isPrefer ? ' 偏好食物加成×1.5！' : '';
  showCelebration(food.emoji, `${pet.name}吃得好开心！+${satietyGain}饱食 +${expGain}经验${preferText}`);

  // 每日首次喂养触发动画+语音
  if(isFirstFeedToday){
    setTimeout(() => showFeedAnimation(childId), 500);
  }

  renderPetPanel(childId);
  render();
}

function checkPetLevelUp(childId){
  const child = appData.children.find(c => c.id === childId);
  const pet = child.pet;
  // 升级所需：Lv1→2需10, Lv2→3需15, Lv3→4需20, Lv(n)→(n+1)需 10+(n-1)*5
  function expNeeded(level){ return 10 + (level - 1) * 5; }
  let leveledUp = false;
  const oldLevel = pet.level;
  while(pet.exp >= expNeeded(pet.level)){
    pet.exp -= expNeeded(pet.level);
    pet.level++;
    leveledUp = true;
  }
  if(leveledUp){
    // 检查是否进化
    const pt = PET_TYPES[pet.type];
    if(pt && pt.stages){
      const oldStage = getPetStage(pet.type, oldLevel);
      const newStage = getPetStage(pet.type, pet.level);
      if(oldStage.name !== newStage.name){
        setTimeout(() => {
          showCelebration(newStage.emoji, `✨ ${pet.name}进化了！变成了${newStage.name}！`);
          spawnFireworks();
        }, 800);
        return; // 进化动画优先，不重复显示升级
      }
    }
    setTimeout(() => {
      showCelebration('🎉', `${pet.name}升级了！Lv.${pet.level}！`);
      spawnFireworks();
    }, 300);
  }
}

// === 战斗力计算 ===
function calcCombatPower(child){
  const pet = child.pet;
  if(!pet || !pet.type) return { attack:0, defense:0, speed:0, maxHp:0, cp:0 };
  const pt = PET_TYPES[pet.type];
  const armorBonus = pet.armor ? ARMORS[pet.armor].bonus : 0;
  const weaponBonus = pet.weapon ? WEAPONS[pet.weapon].bonus : 0;
  const attack = Math.floor(pt.baseAttack + pet.level * 2 + weaponBonus + pet.totalFoodFed / 20);
  const defense = Math.floor(pt.baseDefense + pet.level * 1.5 + armorBonus + pet.totalFoodFed / 30);
  const speed = Math.floor(pt.baseSpeed + pet.level * 0.5);
  const maxHp = Math.floor(50 + pet.level * 10 + pet.totalFoodFed / 10);
  const moodMod = pet.satiety < 30 ? 0.8 : 1.0;
  return {
    attack: Math.floor(attack * moodMod),
    defense: Math.floor(defense * moodMod),
    speed: Math.floor(speed * moodMod),
    maxHp: Math.floor(maxHp * moodMod),
    cp: Math.floor((attack + defense + speed + maxHp / 5) * moodMod),
  };
}

function renderQuestTab(childId){
  const child = appData.children.find(c => c.id === childId);
  if(!child) return '';
  const qs = child.questState;
  const todayClearedCount = qs.todayCleared.length;
  const canPlay = todayClearedCount < QUEST_CONFIG.stagesPerDay;

  let html = `<div style="background:#f9fafb;border-radius:12px;padding:10px;margin:10px 0;text-align:center;">

    <div style="font-size:11px;color:#9ca3af;margin-top:4px;">累计通关 ${qs.totalCleared} 关</div>
  </div>`;

  // 关卡列表
  html += `<div class="quest-stage-list">`;
  for(let i = 1; i <= QUEST_CONFIG.totalStages; i++){
    const cleared = qs.totalCleared >= i;
    const current = qs.currentStage === i && !cleared;
    const locked = qs.currentStage < i;
    const isBoss = i % 5 === 0;
    const cls = cleared ? 'cleared' : current ? (isBoss?'boss current':'current') : locked ? 'locked' : (isBoss?'boss':'');

    html += `<div style="text-align:center;color:#9ca3af;font-size:13px;margin-top:12px;">今天的闯关次数用完啦，明天再来吧！</div>`;
  } else if(qs.currentStage <= QUEST_CONFIG.totalStages){
    const quest = getQuestForChild(childId, qs.currentStage);
    html += `<div style="text-align:center;margin-top:12px;">
      <button onclick="startQuest('${childId}',${qs.currentStage})" style="padding:12px 32px;border-radius:14px;border:none;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-size:15px;font-weight:700;cursor:pointer;">

      </button>
    </div>`;

    html += `<div style="text-align:center;color:#10b981;font-size:14px;font-weight:700;margin-top:12px;">🎉 全部通关！太厉害了！</div>`;
  }
  return html;
}

function getQuestForChild(childId, stageNum){
  const content = STUDY_CONTENT[childId];
  const allKps = [];
  Object.keys(content).forEach(subjKey => {
    const subj = content[subjKey];
    (subj.review || []).forEach(kp => allKps.push({ ...kp, subject: subjKey }));
    (subj.preview || []).forEach(kp => allKps.push({ ...kp, subject: subjKey }));
  });
  // 知识点不够30关时，补充对应年级的数学内容
  if(allKps.length < QUEST_CONFIG.totalStages && EXTRA_MATH[childId + '_extra']){
    EXTRA_MATH[childId + '_extra'].forEach(kp => {
      if(!allKps.find(k => k.id === kp.id)){
        allKps.push({ ...kp, subject: 'math' });
      }
    });
  }
  const kp = allKps[(stageNum - 1) % allKps.length];
  const isBoss = stageNum % 5 === 0;
  const sceneName = QUEST_SCENES[stageNum - 1] || `第${stageNum}关`;
  return { stageNum, kp, isBoss, sceneName };
}

let questState = {}; // 临时闯关状态

function startQuest(childId, stageNum){
  const child = appData.children.find(c => c.id === childId);
  if(!child) return;
  const qs = child.questState;
  if(qs.todayCleared.length >= QUEST_CONFIG.stagesPerDay){
    showToast('今天的闯关次数用完啦！');
    return;
  }
  if(stageNum !== qs.currentStage){
    showToast('请按顺序闯关！');
    return;
  }
  const quest = getQuestForChild(childId, stageNum);
  questState = { childId, stageNum, quest, isBoss: quest.isBoss, bossPhase: 0, answered: false };

  const kp = quest.kp;
  let html = `<div class="pet-panel-header"><h2>🎮 ${quest.sceneName}${quest.isBoss?' 👑BOSS':''}</h2><button class="pet-close-btn" onclick="closePetPanel()">✕</button></div>`;
  html += `<div class="quest-detail-card">`;
  html += `<div class="quest-scene-name">📍 ${quest.sceneName}</div>`;
  if(quest.isBoss){
    html += `<div style="text-align:center;font-size:12px;color:#ef4444;margin-bottom:8px;">👑 BOSS关：需要连续答对${quest.isBoss?'2':'1'}题！</div>`;
  }

  html += `<div class="quest-kp-detail">${kp.detail || kp.desc || ''}</div>`;
  html += `</div>`;

  const ex = kp.exercise;
  if(ex){
    html += `<div style="font-size:13px;font-weight:700;margin:10px 0 6px;">📝 闯关题目</div>`;
    html += `<div style="font-size:13px;color:#4b5563;margin-bottom:10px;">${ex.q}</div>`;
    html += `<div class="quest-options" id="questOptions">`;
    ex.options.forEach((opt, i) => {
      html += `<div class="quest-option" onclick="answerQuest(this, ${i}, ${ex.answer})">${String.fromCharCode(65+i)}. ${opt}</div>`;
    });
    html += `</div>`;
  } else {
    html += `<div style="text-align:center;color:#9ca3af;margin:20px;">本题无练习，直接通关！</div>`;
    html += `<button onclick="clearQuest('${childId}',${stageNum})" style="display:block;width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;">🎉 通关！</button>`;
  }

  document.getElementById('petPanel').innerHTML = html;
  document.getElementById('petOverlay').classList.add('show');
}

function answerQuest(el, chosen, correct){
  const container = el.parentElement;
  const options = container.querySelectorAll('.quest-option');
  options.forEach(o => o.classList.add('disabled'));

  if(chosen === correct){
    el.classList.add('correct');
    if(questState.isBoss && questState.bossPhase === 0){
      // BOSS关第一题答对，进入第二题
      questState.bossPhase = 1;
      setTimeout(() => {
        showCelebration('✅', '第一题答对！还有一题！');
        // 重新出题：用下一个知识点
        const child = appData.children.find(c => c.id === questState.childId);
        const nextQuest = getQuestForChild(questState.childId, questState.stageNum + 1);
        const kp2 = nextQuest.kp;
        let html2 = `<div class="pet-panel-header"><h2>🎮 ${questState.quest.sceneName} 👑BOSS第二题</h2><button class="pet-close-btn" onclick="closePetPanel()">✕</button></div>`;
        html2 += `<div class="quest-detail-card"><div class="quest-scene-name">👑 最终挑战！</div>`;
        html2 += `<div class="quest-kp-topic">📚 ${kp2.topic}</div>`;
        html2 += `<div class="quest-kp-detail">${kp2.detail || kp2.desc || ''}</div></div>`;
        const ex2 = kp2.exercise;
        if(ex2){
          html2 += `<div style="font-size:13px;font-weight:700;margin:10px 0 6px;">📝 最终题目</div>`;
          html2 += `<div style="font-size:13px;color:#4b5563;margin-bottom:10px;">${ex2.q}</div>`;
          html2 += `<div class="quest-options">`;
          ex2.options.forEach((opt, i) => {
            html2 += `<div class="quest-option" onclick="answerQuest2(this, ${i}, ${ex2.answer})">${String.fromCharCode(65+i)}. ${opt}</div>`;
          });
          html2 += `</div>`;
        } else {
          html2 += `<button onclick="clearQuest('${questState.childId}',${questState.stageNum})" style="display:block;width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;">🎉 通关！</button>`;
        }
        document.getElementById('petPanel').innerHTML = html2;
      }, 1000);
    } else {
      // 通关
      setTimeout(() => clearQuest(questState.childId, questState.stageNum), 800);
    }
  } else {
    el.classList.add('wrong');
    options[correct].classList.add('correct');
    setTimeout(() => {
      showCelebration('💪', '答错了，再试一次！');
      // 重置选项
      options.forEach(o => { o.classList.remove('disabled','correct','wrong'); });
    }, 1500);
  }
}

function answerQuest2(el, chosen, correct){
  // BOSS第二题
  const container = el.parentElement;
  const options = container.querySelectorAll('.quest-option');
  options.forEach(o => o.classList.add('disabled'));
  if(chosen === correct){
    el.classList.add('correct');

}

function clearQuest(childId, stageNum){
  const child = appData.children.find(c => c.id === childId);
  if(!child) return;
  const qs = child.questState;
  const isBoss = stageNum % 5 === 0;

  // 奖励
  const points = isBoss ? QUEST_CONFIG.bossReward : QUEST_CONFIG.rewardPerStage;
  child.totalPoints += points;
  child.weekPoints += points;

  // 食物奖励
  const pt = child.pet && child.pet.type ? PET_TYPES[child.pet.type] : null;
  let foodId, foodAmount;
  if(isBoss){
    foodId = 'cake'; foodAmount = 1;
  } else if(pt){
    foodId = pt.preferFood; foodAmount = QUEST_CONFIG.bonusFoodPerStage;
  } else {
    foodId = 'seed'; foodAmount = 1;
  }
  child.foodBag[foodId] = (child.foodBag[foodId] || 0) + foodAmount;

  // 更新闯关状态
  qs.todayCleared.push(stageNum);
  qs.totalCleared = Math.max(qs.totalCleared, stageNum);
  qs.currentStage = Math.max(qs.currentStage, stageNum + 1);
  qs.lastClearDate = getToday();

  // 宠物经验
  if(child.pet && child.pet.type){
    child.pet.exp += isBoss ? 30 : 15;
    checkPetLevelUp(childId);
  }

  saveData();

  const foodName = FOODS[foodId].name;
  showCelebration(isBoss?'👑':'⭐', `通关第${stageNum}关！+${points}积分 +${foodAmount}${foodName}`);
  spawnFireworks();

  petPanelTab = 'quest';
  renderPetPanel(childId);
  render();
}

function scoreBookNote(childId, bookTitle){
  const child = appData.children.find(c => c.id === childId);
  const note = child.bookNotes[bookTitle] || '';
  if(note.length < 10) return null;

  const bookDetail = BOOK_DETAILS[bookTitle] || {};
  const dims = { length:0, keywords:0, emotion:0, depth:0 };

  // 维度1：篇幅 (0-20)
  if(note.length >= 200) dims.length = 20;
  else if(note.length >= 100) dims.length = 15;
  else if(note.length >= 50) dims.length = 10;
  else dims.length = 5;

  // 维度2：关键内容命中 (0-30)
  // 优先使用手动配的关键词，没有则自动提取
  let uniqueWords = bookDetail.keywords || [];
  if(uniqueWords.length === 0){
    const text = (bookDetail.intro||'') + (bookDetail.why||'') + (bookDetail.trial||'');
    const words = text.match(/[\u4e00-\u9fa5]{2,4}/g) || [];
    uniqueWords = [...new Set(words)].filter(w => w.length >= 2);
  }
  const hitWords = uniqueWords.filter(w => note.includes(w));
  dims.keywords = Math.min(30, hitWords.length * 6);

  // 维度3：情感表达 (0-20)
  const emotionWords = ['喜欢','讨厌','感动','开心','难过','惊讶','害怕','兴奋',
    '有趣','无聊','棒','好','坏','厉害','可怜','勇敢','聪明','笨','可爱','帅',
    '美','丑','温暖','冷','我觉得','我认为','让我','我想起','我希望','如果是我'];
  let emotionCount = 0;
  emotionWords.forEach(w => { if(note.includes(w)) emotionCount++; });
  dims.emotion = Math.min(20, emotionCount * 4);

  // 维度4：理解深度 (0-30)
  const depthIndicators = [
    { pattern: /因为|所以|原因是/, score: 5, label: '因果分析' },
    { pattern: /如果.{0,10}就|假如/, score: 5, label: '假设推理' },
    { pattern: /和.{1,5}一样|和.{1,5}不同|比.{1,5}更/, score: 5, label: '比较分析' },
    { pattern: /我学到了|让我明白了|告诉我|道理/, score: 5, label: '总结提炼' },
    { pattern: /就像我|和我一样|生活中|现实中/, score: 5, label: '联系实际' },
    { pattern: /不过|但是|可是|虽然/, score: 5, label: '辩证思考' },
  ];
  let depthScore = 0;
  const depthHits = [];
  depthIndicators.forEach(d => {
    if(d.pattern.test(note)){ depthScore += d.score; depthHits.push(d.label); }
  });
  dims.depth = Math.min(30, depthScore);

  const totalScore = dims.length + dims.keywords + dims.emotion + dims.depth;

  let level, foodReward, foodAmount, feedback, hints;
  if(totalScore >= 80){
    level = 'excellent'; foodReward = 'cake'; foodAmount = 3;
    feedback = '太棒了！你的读后感写得非常精彩，既有内容概括又有自己的思考，理解得很深刻！';
    hints = [];
  } else if(totalScore >= 60){
    level = 'good'; foodReward = 'cake'; foodAmount = 1;
    feedback = '写得不错！你很好地理解了书的内容，也有自己的感受，继续保持！';
    hints = ['可以试着联系自己的生活经历想一想', '试试说说你最喜欢哪个角色，为什么'];
  } else if(totalScore >= 40){
    level = 'fair';
    foodReward = (child.pet && child.pet.type) ? PET_TYPES[child.pet.type].preferFood : 'seed';
    foodAmount = 2;
    feedback = '你读得很认真！再多写一些自己的想法会更好哦。';
    hints = ['试试用自己的话复述一下故事的主要内容', '可以写写你最喜欢的段落或人物', '想一想如果换作你，你会怎么做？'];
  } else {
    level = 'needs_improve';
    foodReward = (child.pet && child.pet.type) ? PET_TYPES[child.pet.type].preferFood : 'seed';
    foodAmount = 1;
    feedback = '开始写读后感啦，真棒！再写长一点，说说你的想法吧。';
    hints = ['可以先说说这本书讲了什么故事', '写写你读完之后的感受，开心还是难过？', '挑一个你喜欢的人物说一说'];
  }

  return {
    score: totalScore, level,
    dimensions: {
      length:   { score: dims.length,   max: 20, label: '篇幅' },
      keywords: { score: dims.keywords, max: 30, label: '关键内容' },
      emotion:  { score: dims.emotion,  max: 20, label: '情感表达' },
      depth:    { score: dims.depth,    max: 30, label: '理解深度' },
    },
    depthHits, feedback, hints, foodReward, foodAmount,
  };
}

function submitBookNoteForScoring(childId, bookIndex, bookTitle){
  // 先保存笔记
  saveBookNote(childId, bookIndex, bookTitle);

  const child = appData.children.find(c => c.id === childId);
  const result = scoreBookNote(childId, bookTitle);
  if(!result){
    showToast('再多写一些（至少10个字）就可以获得评分啦！');
    return;
  }

  // 防止重复评分加分（同一本书只能评分一次）
  const scoreKey = '__aiScore_' + bookTitle;
  if(child.bookNotes[scoreKey]){
    showToast('这本书已经评过分了，去看之前的评分吧！');
    showScoreResultModal(child.bookNotes[scoreKey]);
    return;
  }

  // 存储评分
  if(!child.bookNotes) child.bookNotes = {};
  child.bookNotes[scoreKey] = { ...result, scoredAt: getToday() };

  // 阅读理解积分：根据评分等级给1-5分
  const readingPoints = result.level === 'excellent' ? 5 :
                         result.level === 'good' ? 4 :
                         result.level === 'fair' ? 3 : 1;
  child.totalPoints += readingPoints;
  child.weekPoints += readingPoints;
  result.readingPoints = readingPoints;

  // 发放食物奖励
  child.foodBag[result.foodReward] = (child.foodBag[result.foodReward] || 0) + result.foodAmount;

  saveData();
  showScoreResultModal(result);
  render();
}

function showScoreResultModal(result){
  const food = FOODS[result.foodReward];
  const colors = { excellent:'#16a34a', good:'#0ea5e9', fair:'#f59e0b', needs_improve:'#ec4899' };
  const labels = { excellent:'优秀🌟', good:'良好⭐', fair:'不错📝', needs_improve:'加油💪' };

  let html = '<div class="score-result-modal">';
  html += `<div style="font-size:48px;">${result.score>=80?'🌟':result.score>=60?'⭐':'📝'}</div>`;
  html += `<div class="score-big" style="color:${colors[result.level]};">${result.score}<span style="font-size:18px;">分</span></div>`;
  html += `<div style="font-size:14px;font-weight:600;color:${colors[result.level]};margin-bottom:12px;">${labels[result.level]}</div>`;

  html += '<div class="score-dim-grid">';
  Object.values(result.dimensions).forEach(d => {
    const pct = (d.score / d.max) * 100;
    html += `<div class="score-dim-card">
      <div class="score-dim-label">${d.label}</div>
      <div class="score-dim-val">${d.score}/${d.max}</div>
      <div class="score-dim-bar"><div class="score-dim-fill" style="width:${pct}%;background:${colors[result.level]};"></div></div>
    </div>`;
  });
  html += '</div>';

  html += `<p class="score-feedback">${result.feedback}</p>`;

  if(result.depthHits && result.depthHits.length > 0){
    html += `<div style="background:#ecfdf5;border-radius:10px;padding:8px;margin:6px 0;font-size:12px;color:#059669;">✨ 亮点：${result.depthHits.join('、')}</div>`;
  }

  if(result.hints.length > 0){
    html += '<div class="score-hints">';
    html += '<div class="score-hints-title">💡 理解提示（下次写更好）</div>';
    result.hints.forEach(h => html += `<div class="score-hint-item">• ${h}</div>`);
    html += '</div>';
  }

  html += `<div class="score-reward">
    <div style="font-size:14px;font-weight:700;color:#92400e;">🎁 阅读理解奖励</div>
    <div style="font-size:28px;margin:4px 0;">⭐ +${result.readingPoints || 0}积分 · ${food.emoji} x${result.foodAmount}</div>
    <div style="font-size:12px;color:#92400e;">积分已加入总分 · ${food.name} 已放入背包</div>
  </div>`;

  html += '</div>';
  showModal('📝 读后感评分', html);
}
